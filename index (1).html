<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi em, mùa Noel này 🎄</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffd98a;--ink:#fff6e6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1a0f08;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%}
#road{position:fixed;left:50%;bottom:7%;width:min(78vw,520px);text-align:center;
 transform:translateX(-50%) perspective(420px) rotateX(38deg);transform-origin:bottom;transition:opacity 2s;
 font-family:'Dancing Script','Brush Script MT',cursive;font-size:clamp(20px,4.6vw,34px);line-height:1.5;color:#fff3d1;text-shadow:0 2px 8px #3a1d05}
#road p{margin:.2em 0;opacity:0;transition:opacity 1.6s}
#road p.on{opacity:1}
.btn{position:fixed;left:50%;bottom:calc(2.5% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
 background:rgba(255,230,170,.18);border:1px solid var(--gold);color:var(--gold);padding:10px 22px;border-radius:30px;
 font:500 15px 'Be Vietnam Pro',sans-serif;cursor:pointer;backdrop-filter:blur(6px);transition:opacity 1.5s;z-index:5}
.btn:hover{background:rgba(255,230,170,.32)}
#title{position:fixed;top:calc(4% + env(safe-area-inset-top,0px));width:100%;text-align:center;font-family:'Dancing Script',cursive;
 font-size:clamp(30px,7vw,56px);color:#fff;text-shadow:0 0 18px #ffd98a99;opacity:0;transition:opacity 3s;pointer-events:none}
#hint{position:fixed;top:calc(4% + env(safe-area-inset-top,0px) + clamp(44px,9vw,76px));width:100%;text-align:center;font-weight:300;opacity:0;transition:opacity 3s;font-size:14px;pointer-events:none}
.gift{position:fixed;font-size:34px;line-height:1;border:0;background:none;cursor:pointer;padding:0;transform-origin:50% 0;
 animation:sw 3s ease-in-out infinite;filter:drop-shadow(0 0 8px #ffd98a);opacity:0;pointer-events:none;transition:opacity 2s;z-index:4}
.gift.show{opacity:1;pointer-events:auto}
.gift:hover{transform:scale(1.25)}
@keyframes sw{0%,100%{rotate:-6deg}50%{rotate:6deg}}
#modal{position:fixed;inset:0;background:rgba(5,5,20,.82);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.on{display:flex}
#card{background:#fffaf0;color:#4a2a1a;border-radius:10px;padding:14px 14px 18px;max-width:min(92vw,420px);text-align:center;
 box-shadow:0 10px 50px #000;transform:rotate(-2deg);animation:pop .5s}
#card img{width:100%;max-height:60vh;object-fit:cover;border-radius:4px;display:block}
#cap{font-family:'Dancing Script',cursive;font-size:26px;margin:12px 0 2px}
#msg{font-size:14px;margin:0 0 10px;font-weight:300}
#card button{border:0;background:#c0392b;color:#fff;padding:7px 18px;border-radius:20px;cursor:pointer;font:500 14px 'Be Vietnam Pro'}
@keyframes pop{from{transform:scale(.3) rotate(10deg);opacity:0}}
#up{position:fixed;right:12px;top:calc(8px + env(safe-area-inset-top,0px));font-size:12px;opacity:0;transition:opacity 2s;z-index:6;color:var(--gold);cursor:pointer;
 border:1px dashed var(--gold);padding:5px 10px;border-radius:14px}
#up input{display:none}
#gate{position:fixed;inset:0;z-index:50;background:#1a0f08;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;font-family:'Dancing Script',cursive;font-size:30px;color:var(--gold)}
#gate input{font:500 18px 'Be Vietnam Pro',sans-serif;padding:10px 16px;border-radius:24px;border:1px solid var(--gold);background:rgba(255,255,255,.08);color:#fff;text-align:center;outline:none;width:min(80vw,260px)}
#gate small{font:300 13px 'Be Vietnam Pro',sans-serif;color:#ff9b9b;min-height:1em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gate">Nhập mật khẩu để mở quà 🎁<input id="pw" type="password" inputmode="numeric" placeholder="••••••" autocomplete="off"><button class="btn" id="pwb" style="position:static;transform:none">Mở</button><small id="pwe"></small></div>
<div id="road"></div>
<div id="title">Merry Christmas, em yêu 🎄</div>
<div id="hint">Chạm vào những hộp quà trên cây nhé ✨</div>
<button class="btn" id="next">Đi tiếp con đường này →</button>
<div id="modal"><div id="card"><img id="pic" alt=""><div id="cap"></div><p id="msg"></p><button id="close">Đóng 💌</button></div></div>

<script>
/* ====== CHỈNH Ở ĐÂY ====== */
const CONFIG = {
  // Những dòng chữ hiện trên con đường (tên em, lời nhắn...)
  lines: ["Gửi em – người anh thương nhất,",
          "Mỗi con đường anh đi qua,",
          "đều đẹp hơn vì có em bên cạnh.",
          "Anh có một món quà nhỏ cho em… 🍂"],
  // 6 hộp quà: thay "photo" bằng link ảnh của hai đứa (hoặc bấm nút 📷 để chọn ảnh từ máy)
  gifts: [
    {photo:"", title:"Lần đầu gặp nhau", msg:"Hôm đó anh đã biết mình toang rồi 😆"},
    {photo:"", title:"Buổi hẹn đầu tiên", msg:"Anh hồi hộp đến mức quên cả uống nước."},
    {photo:"", title:"Chuyến đi của tụi mình", msg:"Đi đâu cũng được, miễn là có em."},
    {photo:"", title:"Ngày em cười thật tươi", msg:"Nụ cười đó là bug anh không muốn fix."},
    {photo:"", title:"Những ngày bình thường", msg:"Bình thường mà hạnh phúc, nhờ em."},
    {photo:"", title:"Giáng sinh này", msg:"Cảm ơn em đã là bản release đẹp nhất đời anh ❤️"}
  ]
};
/* ========================= */

/* Mật khẩu mở trang. Để rỗng "" nếu không muốn dùng mật khẩu */
const PASSWORD="";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,m=0,phase=0,T=0,off=0,wind=0;
const $=id=>document.getElementById(id);
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout()}
addEventListener('resize',resize);

// Hạt: lá vàng -> tuyết
const P=Array.from({length:110},()=>({x:Math.random(),y:Math.random(),vy:.0007+Math.random()*.0015,ph:Math.random()*6,
  s:4+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.06,c:Math.random()}));
const stars=Array.from({length:90},()=>[Math.random(),Math.random()*.6,Math.random()*1.4+.3,Math.random()*6]);
const lights=Array.from({length:70},()=>{const f=.08+Math.random()*.9;return [f,(Math.random()*2-1)*.8,Math.random()*6,Math.floor(Math.random()*4)]});
const LC=['#ffd54a','#ff5c5c','#7cf0ff','#ff9be0'];

// Hình học cây thông
let tree={};
function layout(){
  const th=Math.min(H*.66,W*1.05),cx=W/2,by=H*.86;
  tree={cx,ty:by-th,by,th,hw:th*.36};
  const g=document.querySelectorAll('.gift');
  g.forEach((el,i)=>{const p=GP[i];const f=p[0];const y=tree.ty+th*f*.88+th*.04;const x=cx+p[1]*tree.hw*(.2+.8*f)*.85;
    el.style.left=(x-17)+'px';el.style.top=y+'px'});
}
const GP=[[.28,-.4],[.42,.55],[.5,-.7],[.62,.35],[.74,-.5],[.84,.6]];

function lerp(a,b,t){return a+(b-a)*t}
function scene1(a){
  if(a<=0)return;ctx.globalAlpha=a;
  const cx=W/2,yh=H*.44;
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f6c98a');g.addColorStop(.45,'#fbe3b0');g.addColorStop(1,'#b87a2e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // mặt trời
  let sg=ctx.createRadialGradient(cx,yh-10,5,cx,yh-10,H*.35);sg.addColorStop(0,'#fffbe8');sg.addColorStop(1,'#fff0c800');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  // đường
  ctx.beginPath();ctx.moveTo(cx-6,yh);ctx.lineTo(cx+6,yh);ctx.lineTo(cx+W*.48,H);ctx.lineTo(cx-W*.48,H);ctx.closePath();
  g=ctx.createLinearGradient(0,yh,0,H);g.addColorStop(0,'#e9c27a');g.addColorStop(1,'#a8692a');ctx.fillStyle=g;ctx.fill();
  // cỏ hai bên
  [[-1],[1]].forEach(([s])=>{ctx.beginPath();ctx.moveTo(cx+s*6,yh);ctx.lineTo(cx+s*W*.48,H);ctx.lineTo(cx+s*W,H);ctx.lineTo(cx+s*W,yh);ctx.closePath();
    ctx.fillStyle='#9a6a22';ctx.fill()});
  // hàng cây (tiến dần về phía mình)
  const n=8,list=[];
  for(let i=0;i<n;i++){const d=((i/n)+off)%1;list.push(d)}
  list.sort((a,b)=>a-b);
  for(const d of list){const s=d*d;const y=yh+(H-yh)*s;
    for(const side of [-1,1]){
      const x=cx+side*(10+W*.5*s+W*.07*s);const th=H*.7*s+8,tw=th*.07+1;
      ctx.fillStyle='#4a2c14';ctx.fillRect(x-tw/2,y-th,tw,th);
      const R=th*.42;
      [[0,-th,1],[-.7,-th*.9,.75],[.7,-th*.9,.75],[0,-th*1.25,.7]].forEach(([dx,dy,k],j)=>{
        ctx.beginPath();ctx.arc(x+dx*R,y+dy*(1)+th*.05,R*k,0,7);
        ctx.fillStyle=['#e8a21c','#f5bf3b','#d9801a','#ffd45e'][j];ctx.fill()});
    }}
  ctx.globalAlpha=1;
}
function scene2(a){
  if(a<=0)return;ctx.globalAlpha=a;
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050b24');g.addColorStop(.6,'#13245a');g.addColorStop(1,'#243a78');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  stars.forEach(([x,y,r,p])=>{ctx.globalAlpha=a*(.5+.5*Math.sin(T*2+p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x*W,y*H,r,0,7);ctx.fill()});
  ctx.globalAlpha=a;
  // trăng
  const mx=W*.82,my=H*.17,mr=Math.min(W,H)*.07;
  let mg=ctx.createRadialGradient(mx,my,mr*.5,mx,my,mr*4);mg.addColorStop(0,'#fff8d8aa');mg.addColorStop(1,'#fff8d800');
  ctx.fillStyle=mg;ctx.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);
  ctx.fillStyle='#fff6cf';ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();
  ctx.fillStyle='#ecdca0';[[-.3,-.2,.2],[.25,.2,.25],[.1,-.4,.12]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(mx+x*mr,my+y*mr,r*mr,0,7);ctx.fill()});
  // nền tuyết
  ctx.fillStyle='#e9f1ff';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*.86);
  ctx.bezierCurveTo(W*.3,H*.82,W*.7,H*.9,W,H*.85);ctx.lineTo(W,H);ctx.fill();
  // cây thông
  const {cx,ty,by,th,hw}=tree;
  ctx.fillStyle='#5a3418';ctx.fillRect(cx-th*.04,by-th*.08,th*.08,th*.1);
  for(let i=0;i<4;i++){const top=ty+th*i*.2,bot=ty+th*(.36+i*.2),w=hw*(.45+i*.2);
    ctx.beginPath();ctx.moveTo(cx,top);ctx.lineTo(cx+w,bot);ctx.quadraticCurveTo(cx,bot+th*.04,cx-w,bot);ctx.closePath();
    const gg=ctx.createLinearGradient(cx-w,0,cx+w,0);gg.addColorStop(0,'#0b4a2a');gg.addColorStop(.5,'#1b7a45');gg.addColorStop(1,'#0b4a2a');
    ctx.fillStyle=gg;ctx.fill()}
  // dây đèn
  lights.forEach(([f,o,p,c])=>{const y=ty+th*(.1+f*.78),x=cx+o*hw*(.2+.8*f)*.9;
    ctx.globalAlpha=a*(.45+.55*Math.sin(T*3+p));ctx.fillStyle=LC[c];ctx.shadowColor=LC[c];ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill()});
  ctx.shadowBlur=0;ctx.globalAlpha=a;
  // ngôi sao
  const sy=ty-2,sr=th*.04;ctx.fillStyle='#ffe066';ctx.shadowColor='#ffe066';ctx.shadowBlur=25;ctx.beginPath();
  for(let i=0;i<10;i++){const r=i%2?sr*.45:sr,an=-Math.PI/2+i*Math.PI/5;ctx.lineTo(cx+Math.cos(an)*r,sy+Math.sin(an)*r)}
  ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;
}
function particles(){
  wind=Math.sin(T*.4)*.0009+.0007*(1-m);
  for(const p of P){
    p.y+=p.vy*(1-m*.4)*(1+m*.2);p.x+=wind*(1-m*.7)+Math.sin(T*1.3+p.ph)*.0004*(1-m*.5);p.r+=p.vr*(1-m);
    if(p.y>1.05){p.y=-.05;p.x=Math.random()}if(p.x>1.05)p.x=-.05;if(p.x<-.05)p.x=1.05;
    const x=p.x*W,y=p.y*H;ctx.save();ctx.translate(x,y);ctx.rotate(p.r);
    const gold=p.c<.5?[240,170,40]:[205,105,30];
    ctx.fillStyle=`rgb(${lerp(gold[0],255,m)|0},${lerp(gold[1],255,m)|0},${lerp(gold[2],255,m)|0})`;
    ctx.beginPath();ctx.ellipse(0,0,p.s*lerp(1,.45,m),p.s*lerp(.55,.45,m),0,0,7);ctx.fill();
    if(m<.5){ctx.strokeStyle='#8a4b10';ctx.globalAlpha=1-m*2;ctx.beginPath();ctx.moveTo(-p.s,0);ctx.lineTo(p.s,0);ctx.stroke();ctx.globalAlpha=1}
    ctx.restore();
  }
}
/* ===== ĐỒ HỌA THỰC TẾ HƠN (vẽ sẵn ra bộ đệm, ghi đè các hàm cũ) ===== */
let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w*DPR;c.height=h*DPR;const x=c.getContext('2d');x.scale(DPR,DPR);return [c,x]};
let BG1,BG2,TS,TR2;
const LP=[[232,160,30],[245,190,60],[214,112,28],[190,70,30],[250,215,100],[160,90,30]];
const leafC=()=>LP[R()*LP.length|0];
function layout(){
  const th=Math.min(H*.66,W*1.05),cx=W/2,by=H*.86;
  tree={cx,ty:by-th,by,th,hw:th*.36};
  document.querySelectorAll('.gift').forEach((el,i)=>{const p=GP[i],f=p[0];el.style.left=(cx+p[1]*tree.hw*(.2+.8*f)*.85-19)+'px';el.style.top=(tree.ty+th*f*.88+th*.04)+'px'});
  seed=7;build();
}
function boxSVG(i){const c=['#c0182b','#2a7d4f','#d4a017','#2b5fb4','#a3228a','#c0182b'][i%6],r=i%2?'#ffe08a':'#f4f4f4';
 return `<svg width="38" height="52" viewBox="0 0 38 52"><path d="M19 0V12" stroke="#d9b45a" stroke-width="1.5"/><rect x="3" y="14" width="32" height="30" rx="2" fill="${c}"/><rect x="3" y="14" width="32" height="8" fill="#fff" opacity=".18"/><rect x="16" y="14" width="6" height="30" fill="${r}"/><rect x="3" y="26" width="32" height="5" fill="${r}"/><path d="M19 14C8 2 6 14 19 14ZM19 14C30 2 32 14 19 14Z" fill="${r}"/><rect x="3" y="14" width="32" height="30" rx="2" fill="none" stroke="#0005"/></svg>`}
function build(){
 let c,x,g;const cx=W/2,yh=H*.44;
 /* --- Cảnh 1: hoàng hôn thu --- */
 [c,x]=mk(W,H);BG1=c;
 g=x.createLinearGradient(0,0,0,yh);g.addColorStop(0,'#e89a58');g.addColorStop(1,'#fde3b0');x.fillStyle=g;x.fillRect(0,0,W,yh+2);
 let sg=x.createRadialGradient(cx,yh,2,cx,yh,H*.5);sg.addColorStop(0,'#fffdf0');sg.addColorStop(.25,'#fff0c4aa');sg.addColorStop(1,'#fff0c400');x.fillStyle=sg;x.fillRect(0,0,W,H);
 for(let i=0;i<70;i++){const px=R()*W,r=H*(.03+R()*.05);x.fillStyle=`rgba(${190+R()*40|0},${110+R()*40|0},50,.33)`;x.beginPath();x.arc(px,yh-r*.3,r,0,7);x.fill()}
 g=x.createLinearGradient(0,yh,0,H);g.addColorStop(0,'#c99a52');g.addColorStop(1,'#7a4a1c');x.fillStyle=g;x.fillRect(0,yh,W,H-yh);
 x.beginPath();x.moveTo(cx-5,yh);x.lineTo(cx+5,yh);x.lineTo(cx+W*.48,H);x.lineTo(cx-W*.48,H);x.closePath();
 g=x.createLinearGradient(0,yh,0,H);g.addColorStop(0,'#f0d4a0');g.addColorStop(1,'#b98448');x.fillStyle=g;x.fill();
 x.save();x.clip();for(let i=0;i<9;i++){const d=(i+.5)/9,s=d*d,y=yh+(H-yh)*s;x.fillStyle='rgba(60,30,5,.15)';x.fillRect(0,y,W,H*.05*s+2)}x.restore();
 for(let i=0;i<1200;i++){const s=Math.pow(R(),.7),y=yh+(H-yh)*s,px=cx+(R()*2-1)*(W*.62*s+8),z=1+7*s,k=leafC();
  x.save();x.translate(px,y);x.rotate(R()*6.28);x.fillStyle=`rgba(${k[0]},${k[1]},${k[2]},.88)`;x.beginPath();x.ellipse(0,0,z,z*.5,0,0,7);x.fill();x.restore()}
 /* cây thu (sprite) */
 [c,x]=mk(300,500);TS=c;
 g=x.createLinearGradient(135,0,165,0);g.addColorStop(0,'#2b170a');g.addColorStop(.5,'#6b4423');g.addColorStop(1,'#33200f');
 x.fillStyle=g;x.beginPath();x.moveTo(136,500);x.lineTo(145,250);x.lineTo(155,250);x.lineTo(164,500);x.fill();
 x.strokeStyle='#1e0f05';x.lineWidth=1;for(let i=0;i<14;i++){x.beginPath();x.moveTo(140+R()*20,500);x.lineTo(147+R()*6,260+R()*100);x.stroke()}
 x.strokeStyle='#4a2c14';x.lineWidth=5;[[150,330,90,230],[150,300,215,200],[150,360,225,280],[150,380,70,300]].forEach(([a,b,e,f])=>{x.beginPath();x.moveTo(a,b);x.lineTo(e,f);x.stroke()});
 for(let i=0;i<1800;i++){const a=R()*6.28,rr=Math.sqrt(R()),px=150+Math.cos(a)*rr*145,py=170+Math.sin(a)*rr*128,k=leafC();
  const f=Math.max(.45,.6+(1-py/300)*.35+(px-150)/500),z=3+R()*5;
  x.fillStyle=`rgb(${Math.min(255,k[0]*f)|0},${Math.min(255,k[1]*f)|0},${Math.min(255,k[2]*f)|0})`;x.save();x.translate(px,py);x.rotate(R()*6);x.beginPath();x.ellipse(0,0,z,z*.55,0,0,7);x.fill();x.restore()}
 /* --- Cảnh 2: đêm tuyết --- */
 [c,x]=mk(W,H);BG2=c;
 g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#040920');g.addColorStop(.6,'#122358');g.addColorStop(1,'#2a427f');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let i=0;i<160;i++){x.fillStyle=`rgba(255,255,255,${.3+R()*.6})`;x.beginPath();x.arc(R()*W,R()*H*.65,.4+R()*1.2,0,7);x.fill()}
 const mx=W*.82,my=H*.17,mr=Math.min(W,H)*.07;
 let mg=x.createRadialGradient(mx,my,mr*.6,mx,my,mr*5);mg.addColorStop(0,'rgba(255,248,216,.55)');mg.addColorStop(1,'rgba(255,248,216,0)');x.fillStyle=mg;x.fillRect(mx-mr*5,my-mr*5,mr*10,mr*10);
 mg=x.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);mg.addColorStop(0,'#fffdf0');mg.addColorStop(1,'#e8d9a4');x.fillStyle=mg;x.beginPath();x.arc(mx,my,mr,0,7);x.fill();
 for(let i=0;i<14;i++){const a=R()*6.28,d=Math.sqrt(R())*mr*.85,r=mr*(.05+R()*.15);x.fillStyle='rgba(170,150,100,.28)';x.beginPath();x.arc(mx+Math.cos(a)*d,my+Math.sin(a)*d,r,0,7);x.fill()}
 for(let i=0;i<7;i++){const cxx=W*(.5+R()*.5),cyy=H*(.08+R()*.25),rw=W*(.12+R()*.12);const cg=x.createRadialGradient(cxx,cyy,1,cxx,cyy,rw);cg.addColorStop(0,'rgba(200,215,255,.10)');cg.addColorStop(1,'rgba(200,215,255,0)');x.fillStyle=cg;x.fillRect(cxx-rw,cyy-rw,rw*2,rw*2)}
 g=x.createLinearGradient(0,H*.78,0,H);g.addColorStop(0,'#eef4ff');g.addColorStop(1,'#8fa6da');x.fillStyle=g;
 x.beginPath();x.moveTo(0,H);x.lineTo(0,H*.82);x.bezierCurveTo(W*.3,H*.78,W*.7,H*.84,W,H*.8);x.lineTo(W,H);x.fill();
 x.fillStyle='rgba(15,30,80,.35)';x.beginPath();x.ellipse(tree.cx+tree.hw*.25,tree.by+4,tree.hw*1.1,tree.th*.04,0,0,7);x.fill();
 for(let i=0;i<220;i++){x.fillStyle=`rgba(255,255,255,${.4+R()*.6})`;x.fillRect(R()*W,H*.84+R()*H*.16,1.5,1.5)}
 /* cây thông (sprite) */
 const {th,hw}=tree,sw=hw*2.4,ox=sw/2;[c,x]=mk(sw,th*1.03);TR2=c;
 x.fillStyle='#4a2c14';x.fillRect(ox-th*.03,th*.88,th*.06,th*.14);
 const cols=['#c0182b','#e6b63a','#2b6cc4','#d9dde6'];
 for(let i=0;i<7;i++){const top=th*i*.115,bot=th*(.2+i*.115),w=hw*(.38+i*.105);
  x.fillStyle='#0a3a22';x.beginPath();x.moveTo(ox,top);x.quadraticCurveTo(ox+w*.6,bot*.8+top*.2,ox+w,bot);x.quadraticCurveTo(ox,bot+th*.03,ox-w,bot);x.quadraticCurveTo(ox-w*.6,bot*.8+top*.2,ox,top);x.fill();
  for(let k=0;k<300;k++){const t=Math.pow(R(),.8),y=top+(bot-top)*t,px=ox+(R()*2-1)*w*t,dir=px>ox?1:-1,len=th*.035,lit=.5+.5*((px-ox)/w)*.6+(1-t)*.1;
   x.strokeStyle=`rgb(${15+lit*30|0},${60+lit*90+R()*30|0},${40+lit*30|0})`;x.lineWidth=1.6;x.beginPath();x.moveTo(px,y);x.lineTo(px+dir*len*.8*R(),y+len*.7);x.stroke()}
  for(let k=0;k<22;k++){const t=.75+R()*.25,px=ox+(R()*2-1)*w*t;x.fillStyle='rgba(235,245,255,.8)';x.beginPath();x.ellipse(px,top+(bot-top)*t,3+R()*4,1.5,0,0,7);x.fill()}
  const y0=top+(bot-top)*.78,x0=ox-w*.8,x2=ox+w*.8,cy=bot+th*.05;
  x.strokeStyle='#e8b94a';x.lineWidth=3.5;x.lineCap='round';x.setLineDash([1,6]);x.beginPath();x.moveTo(x0,y0);x.quadraticCurveTo(ox,cy,x2,y0);x.stroke();x.setLineDash([]);
  for(let k=0;k<5;k++){const u=.1+R()*.8,px=(1-u)*(1-u)*x0+2*u*(1-u)*ox+u*u*x2,py=(1-u)*(1-u)*y0+2*u*(1-u)*cy+u*u*y0,r=th*.017,col=cols[R()*4|0];
   const bg=x.createRadialGradient(px-r*.35,py-r*.35,r*.1,px,py,r);bg.addColorStop(0,'#fff');bg.addColorStop(.3,col);bg.addColorStop(1,'#12060a');x.fillStyle=bg;x.beginPath();x.arc(px,py+r,r,0,7);x.fill()}}
 const bx=(X,w,h,c1,r1)=>{x.fillStyle=c1;x.fillRect(X,th*1.0-h,w,h);x.fillStyle=r1;x.fillRect(X+w/2-3,th*1.0-h,6,h);x.fillRect(X,th*1.0-h*.55,w,5)};
 bx(ox-hw*.9,hw*.28,hw*.22,'#b3202f','#ffe08a');bx(ox+hw*.55,hw*.32,hw*.2,'#1f6b4a','#f4f4f4');bx(ox+hw*.18,hw*.2,hw*.16,'#d4a017','#c0182b');
}
function scene1(a){
 if(a<=0||!BG1)return;ctx.globalAlpha=a;ctx.drawImage(BG1,0,0,W,H);
 const cx=W/2,yh=H*.44,n=9,L=[];for(let i=0;i<n;i++)L.push(((i/n)+off)%1);L.sort((p,q)=>p-q);
 for(const d of L){const s=d*d,y=yh+(H-yh)*s,h=H*1.05*s+14,w=h*.6;
  for(const sd of[-1,1]){ctx.save();ctx.globalAlpha=a*Math.min(1,.25+d*1.2);ctx.translate(cx+sd*(14+W*.55*s),y);ctx.scale(sd,1);ctx.drawImage(TS,-w/2,-h,w,h);ctx.restore()}}
 ctx.globalAlpha=a;ctx.globalCompositeOperation='lighter';
 for(let i=0;i<5;i++){ctx.save();ctx.translate(cx,yh);ctx.rotate((i-2)*.28+Math.sin(T*.3+i)*.03);const rg=ctx.createLinearGradient(0,0,0,H);rg.addColorStop(0,'rgba(255,230,160,.16)');rg.addColorStop(1,'rgba(255,230,160,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.lineTo(60+i*8,H);ctx.lineTo(-60-i*8,H);ctx.fill();ctx.restore()}
 ctx.globalCompositeOperation='source-over';
 const vg=ctx.createRadialGradient(cx,H*.5,H*.3,cx,H*.5,H*.95);vg.addColorStop(0,'rgba(40,15,0,0)');vg.addColorStop(1,'rgba(40,15,0,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=1;
}
function scene2(a){
 if(a<=0||!BG2)return;ctx.globalAlpha=a;ctx.drawImage(BG2,0,0,W,H);
 ctx.fillStyle='#fff';for(let i=0;i<25;i++){const s=stars[i];ctx.globalAlpha=a*(.3+.7*Math.abs(Math.sin(T*1.5+s[3])));ctx.beginPath();ctx.arc(s[0]*W,s[1]*H*.9,s[2]*1.3,0,7);ctx.fill()}
 ctx.globalAlpha=a;const {cx,ty,th,hw}=tree;ctx.drawImage(TR2,cx-hw*1.2,ty,hw*2.4,th*1.03);
 ctx.globalCompositeOperation='lighter';
 lights.forEach(([f,o,p,c])=>{const y=ty+th*(.1+f*.78),x=cx+o*hw*(.2+.8*f)*.9,b=.4+.6*Math.sin(T*3+p);ctx.fillStyle=LC[c];ctx.globalAlpha=a*b*.22;ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();ctx.globalAlpha=a*(.5+.5*b);ctx.beginPath();ctx.arc(x,y,2.4,0,7);ctx.fill()});
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=a;
 const sy=ty+2,sr=th*.045;ctx.fillStyle='#ffe066';ctx.shadowColor='#ffe066';ctx.shadowBlur=28;ctx.beginPath();
 for(let i=0;i<10;i++){const r=i%2?sr*.45:sr,an=-Math.PI/2+i*Math.PI/5;ctx.lineTo(cx+Math.cos(an)*r,sy+Math.sin(an)*r)}
 ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;
}
for(let i=0;i<80;i++)P.push({x:Math.random(),y:Math.random(),vy:.0007+Math.random()*.0015,ph:Math.random()*6,s:4+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.06,c:Math.random()});
function particles(){
 wind=Math.sin(T*.4)*.0009+.0007*(1-m);
 for(const p of P){
  p.y+=p.vy*(1-m*.4);p.x+=wind*(1-m*.7)+Math.sin(T*1.3+p.ph)*.0004*(1-m*.5);p.r+=p.vr*(1-m);
  if(p.y>1.05){p.y=-.05;p.x=Math.random()}if(p.x>1.05)p.x=-.05;if(p.x<-.05)p.x=1.05;
  const x=p.x*W,y=p.y*H;
  if(m<1){const k=LP[(p.c*LP.length)|0],s=p.s*1.3;ctx.save();ctx.globalAlpha=1-m;ctx.translate(x,y);ctx.rotate(p.r);ctx.scale(1,Math.cos(T*2+p.ph*3));
   ctx.fillStyle=`rgb(${k[0]},${k[1]},${k[2]})`;ctx.beginPath();ctx.moveTo(-s,0);ctx.quadraticCurveTo(0,-s*.7,s,0);ctx.quadraticCurveTo(0,s*.7,-s,0);ctx.fill();
   ctx.strokeStyle='rgba(90,45,10,.7)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-s*1.2,0);ctx.lineTo(s*.8,0);ctx.stroke();ctx.restore()}
  if(m>0){ctx.save();ctx.globalAlpha=m*(.45+p.s/14);ctx.shadowColor='#fff';ctx.shadowBlur=5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,1+p.s*.22,0,7);ctx.fill();ctx.restore()}
 }
 ctx.globalAlpha=1;
}
let last=0;
function loop(t){
  const dt=Math.min((t-last)/1000||0,.05);last=t;T+=dt;
  if(phase==1){m=Math.min(1,m+dt/4.5);if(m>=1&&phase==1){phase=2;showScene2()}}
  off+=dt*.03*(1-m);
  ctx.clearRect(0,0,W,H);
  scene1(1-m);scene2(m);particles();
  requestAnimationFrame(loop);
}

// Chữ trên đường
const road=$('road');
CONFIG.lines.forEach(l=>{const p=document.createElement('p');p.textContent=l;road.appendChild(p)});
window.reveal=()=>road.querySelectorAll('p').forEach((p,i)=>setTimeout(()=>p.classList.add('on'),1500+i*2200));

// Hộp quà
CONFIG.gifts.forEach((g,i)=>{const b=document.createElement('button');b.className='gift';b.innerHTML=boxSVG(i);b.style.animationDelay=(i*.4)+'s';
  b.setAttribute('aria-label',g.title);b.onclick=()=>openGift(i);document.body.appendChild(b)});

function ph(i){ // ảnh mẫu nếu chưa có ảnh thật
  const c=['#ff8fa3','#ffb347','#7ec8e3','#b39ddb','#81c784','#f48fb1'][i%6];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#fff3e0"/></linearGradient></defs><rect width="600" height="420" fill="url(#g)"/><text x="300" y="235" font-size="120" text-anchor="middle">❤</text><text x="300" y="360" font-size="22" text-anchor="middle" fill="#4a2a1a" font-family="sans-serif">Thay bằng ảnh của tụi mình nhé</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function openGift(i){const g=CONFIG.gifts[i];$('pic').src=g.photo||ph(i);$('cap').textContent=g.title;$('msg').textContent=g.msg;$('modal').classList.add('on')}
$('close').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{if(e.target.id=='modal')$('modal').classList.remove('on')};

function showScene2(){
  $('title').style.opacity=1;$('hint').style.opacity=1;
  document.querySelectorAll('.gift').forEach((g,i)=>setTimeout(()=>g.classList.add('show'),i*350));
}
function go(){if(phase)return;phase=1;road.style.opacity=0;$('next').style.opacity=0;$('next').style.pointerEvents='none'}
$('next').onclick=go;
window.autoGo=()=>setTimeout(go,26000); // tự chuyển cảnh nếu không bấm
function start(){$('gate').style.display='none';reveal();autoGo()}
if(PASSWORD){const g=$('gate');g.style.display='flex';
 const chk=()=>{if($('pw').value===PASSWORD)start();else{$('pwe').textContent='Chưa đúng rồi, thử lại nhé 💭';$('pw').value=''}};
 $('pwb').onclick=chk;$('pw').onkeydown=e=>{if(e.key==='Enter')chk()}}else start();

resize();requestAnimationFrame(loop);
</script>
